apiVersion: batch/v1
kind: Job
metadata:
  generateName: sre-agent-migration-
  labels:
    app: sre-agent-migration
spec:
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sre-agent-migration
    spec:
      serviceAccountName: sre-agent-migrator
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: backend-0002
          image: sre-agent-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - 0002_grafana_normalization_v2
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sre-agent-secrets
                  key: DATABASE_URL
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        - name: worker-0002
          image: sre-agent-rca-worker:latest
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - 0002_adk_specialist_analysis
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sre-agent-secrets
                  key: DATABASE_URL
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        - name: backend-0003
          image: sre-agent-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - 0003_non_partition_runtime_tables
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sre-agent-secrets
                  key: DATABASE_URL
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        - name: worker-0003
          image: sre-agent-rca-worker:latest
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - 0003_validate_ordinary_runtime_tables
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sre-agent-secrets
                  key: DATABASE_URL
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      containers:
        - name: complete
          image: sre-agent-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - print('all migrations completed')
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
