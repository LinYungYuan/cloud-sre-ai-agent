apiVersion: batch/v1
kind: CronJob
metadata:
  name: sre-agent-partition-maintenance
  labels:
    app: sre-agent-partition-maintenance
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: sre-agent-partition-maintenance
        spec:
          serviceAccountName: sre-agent-backend
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: partition-maintenance
              image: sre-agent-backend:latest
              imagePullPolicy: IfNotPresent
              command:
                - sre-agent-ensure-partitions
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: sre-agent-secrets
                      key: DATABASE_URL
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
