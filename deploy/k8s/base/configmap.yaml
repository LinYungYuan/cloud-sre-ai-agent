apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-agent-config
data:
  APP_ENVIRONMENT: production
  PUBSUB_PROJECT_ID: sre-agent
  RCA_TOPIC_ID: rca-jobs
  PUBSUB_SUBSCRIPTION_ID: rca-jobs
  PUBSUB_AUTO_CREATE: "false"
  MODEL_NAME: gemini-2.5-flash
  METRICS_MCP_URL: https://agentgateway.cp.gcubut.gcp.uwccb/agw/gcp-metrics-mcp
  TRACE_MCP_URL: https://agentgateway.cp.gcubut.gcp.uwccb/agw/gcp-trace-mcp
  LOG_MCP_URL: https://agentgateway.cp.gcubut.gcp.uwccb/agw/gcp-log-mcp
  MCP_CAPABILITY_MANIFEST: "[]"
  SPECIALIST_ANALYSIS_MODE: DISABLED
  MCP_MAX_RESPONSE_BYTES: "2097152"
  EVIDENCE_CHUNK_CHARS: "8000"
  EVIDENCE_MAX_CHUNKS: "4"
  EVIDENCE_MAX_TOTAL_CHARS: "32000"
  SPECIALIST_MAX_TOOL_CALLS: "5"
  SPECIALIST_MAX_OBSERVATIONS: "20"
  RCA_DEADLINE_SECONDS: "300"
  AGENT_CORRECTIVE_RETRIES: "1"
  config.json: |
    {
      "apiBaseUrl": "/api/v1",
      "locale": "zh-TW",
      "timeZone": "Asia/Taipei"
    }
