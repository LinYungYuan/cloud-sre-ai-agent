[project]
name = "sre-rca-worker"
version = "0.1.0"
description = "Independent evidence-backed RCA worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "asyncpg",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
