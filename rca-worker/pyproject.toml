[project]
name = "sre-rca-worker"
version = "0.1.0"
description = "Independent evidence-backed RCA worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "asyncpg",
    "google-adk>=2.7.0",
    "google-cloud-pubsub",
    "jsonschema>=4.26.0",
    "mcp>=2.0.0",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "sqlalchemy[asyncio]",
]

[project.scripts]
sre-agent-rca-worker = "sre_rca_worker.workers.rca_worker:main"

[dependency-groups]
dev = [
    "jsonschema",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
