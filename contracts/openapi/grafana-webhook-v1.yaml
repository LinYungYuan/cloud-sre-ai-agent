openapi: 3.1.0
info:
  title: Grafana Webhook API
  version: 1.0.0
  description: Machine-ingestion contract for Grafana alert webhooks.
paths:
  /webhooks/v1/grafana/{sourceId}:
    post:
      operationId: ingestGrafanaWebhook
      summary: Accept a Grafana alert webhook.
      description: The JSON request body must not exceed 1 MiB.
      security:
        - bearerAuth: []
      parameters:
        - name: sourceId
          in: path
          required: true
          description: UUID identifying the registered Grafana source.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrafanaWebhook'
      responses:
        '202':
          description: Webhook accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAccepted'
        '400':
          description: Malformed or invalid webhook payload.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request body exceeds the 1 MiB limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    GrafanaWebhook:
      type: object
      required:
        - status
        - alerts
      properties:
        receiver:
          type: string
        status:
          type: string
          enum: [firing, resolved]
        orgId:
          type: integer
        alerts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GrafanaAlert'
        groupLabels:
          type: object
          additionalProperties:
            type: string
        commonLabels:
          type: object
          additionalProperties:
            type: string
        commonAnnotations:
          type: object
          additionalProperties:
            type: string
        externalURL:
          type: string
          format: uri
        version:
          type: string
        groupKey:
          type: string
        truncatedAlerts:
          type: integer
          minimum: 0
        title:
          type: string
        state:
          type: string
        message:
          type: string
      additionalProperties: true
    GrafanaAlert:
      type: object
      required:
        - status
        - labels
        - annotations
        - startsAt
        - endsAt
        - values
        - generatorURL
        - fingerprint
      properties:
        status:
          type: string
          enum: [firing, resolved]
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        startsAt:
          type: string
          format: date-time
          description: Grafana-supplied RFC 3339 timestamp; offsets are accepted and normalized to UTC (`Z`) during ingestion.
        endsAt:
          type: string
          format: date-time
          description: Grafana-supplied RFC 3339 timestamp; offsets are accepted and normalized to UTC (`Z`) during ingestion.
        values:
          type: object
          additionalProperties: true
        generatorURL:
          type: string
          format: uri
        fingerprint:
          type: string
        silenceURL:
          type: string
          format: uri
          description: Optional URL for silencing the alert in Grafana.
        dashboardURL:
          description: Optional Grafana dashboard URL; the default payload sends an empty string when no dashboard is linked.
          anyOf:
            - type: string
              format: uri
            - const: ''
        panelURL:
          description: Optional Grafana panel URL; the default payload sends an empty string when no panel is linked.
          anyOf:
            - type: string
              format: uri
            - const: ''
        imageURL:
          type: string
          format: uri
          description: Optional panel screenshot URL, omitted when no image is available.
      additionalProperties: true
    WebhookAccepted:
      type: object
      required:
        - deliveryId
        - acceptedAt
      properties:
        deliveryId:
          type: string
          format: uuid
          description: UUID identifying the persisted webhook delivery.
        acceptedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: UTC acceptance timestamp emitted in RFC 3339 `Z` notation.
      additionalProperties: false
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      additionalProperties: true
