services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: sre_agent
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sre_agent"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  pubsub-emulator:
    image: google/cloud-sdk:578.0.0-emulators
    platform: linux/amd64
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --project=sre-agent-local
      - --host-port=0.0.0.0:8085
    ports:
      - "${PUBSUB_HOST_PORT:-58085}:8085"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c 'import socket; socket.create_connection(("127.0.0.1",8085),2)'
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
